# Package metadata lives here (not in pyproject.toml) so it installs with the
# older pip/setuptools shipped by Ubuntu 22.04 as well as newer versions.
[metadata]
name = xmds_python_tools
version = 0.1.0
description = Tools to run, analyse and optimise XMDS2 simulations
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = xmds_python_tools
python_requires = >=3.8
install_requires =
    numpy
    h5py

[options.extras_require]
plot = matplotlib

[options.entry_points]
console_scripts =
    xmds-analyse = xmds_python_tools.analysis_sim_utils:main
    xmds-run-optimal-points = xmds_python_tools.run_optimal_points:main
    xmds-gem-visualiser = xmds_python_tools.gem_visualiser:main
    xmds-optimiser-selftest = xmds_python_tools.sim_optimiseN:main
